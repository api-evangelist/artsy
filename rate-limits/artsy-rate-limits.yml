specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Artsy
providerId: artsy
generated: '2026-09-07'
created: '2026-05-04'
modified: '2026-09-07'
method: searched
source: https://developers.artsy.net/v2/docs/rate_limiting
docs: https://developers.artsy.net/v2/docs/rate_limiting
description: >-
  Published rate limits for the Artsy Public API, read verbatim from the provider's rate-limiting page.
  This file REPLACES a 2026-05-04 bulk-sweep scaffold whose tier/quota numbers and X-RateLimit-* headers
  were invented defaults — Artsy publishes exactly one limit, no tiers, and no response headers at all.
tags:
  - Art
  - Marketplace
  - Rate Limiting
  - Throttling
limit_count: 1
limits:
  - name: Public API request rate
    scope: per-client-application-id
    window: second
    limit: 5
    metric: requests_per_second
    burst: null
    tier: null
    note: >-
      Verbatim: "Artsy API is currently rate-limited to 5 requests per second per client application ID."
      The provider states clients are throttled, not blacklisted, when they exceed it, and that there is
      currently no way to raise the limit.
    raisable: false
    contact_to_raise: artsy-api-developers@googlegroups.com
headers:
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
  note: >-
    Artsy documents NO rate-limit response headers, and none were observed on a live anonymous response.
    An agent gets no remaining-budget or reset signal — it can only observe the 429 after the fact. This
    is a real runtime-signal gap, recorded as an honest absence rather than filled with plausible
    X-RateLimit-* names.
responseCodes:
  throttled: 429
  quotaExceeded: null
  serviceUnavailable: null
exhaustion:
  status: 429
  reason_phrase: Too many requests
  behavior: throttled only; the provider states clients are not blacklisted by default
  recovery: >-
    No reset timestamp is published. Back off and retry; the window is one second, so a compliant client
    simply paces below 5 rps.
quotas:
  published: false
  note: No monthly or daily request quota is published — the only published control is the 5 rps rate.
