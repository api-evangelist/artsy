note: Artsy runs TWO overlapping-but-very-unequal contracts. The Swagger 2.0 Public API carries 53 operations
  across the reference catalog (artists, artworks, genes, shows, fairs, sales) and is announced for retirement.
  Metaphysics, the GraphQL gateway, carries 165 Query root fields and 306 mutations covering commerce,
  editorial, viewing rooms, price insights, consignments and personalization — none of which the REST
  contract exposes. There is no MCP server, so the crosswalk binds DERIVED candidate tools; every REST
  binding is exact because each candidate tool is one operation. The GraphQL side is mapped by root-field
  name read from the published SDL, never invented.
