mcp_only_note: No MCP server exists, so there are no MCP-only tools. The divergence on this provider is
  REST vs GraphQL, recorded below.
graphql_only:
- group: commerce / orders
  fields:
  - commerceAbandonedOrders
  - commerceBankAccountBalance
  - commerceBuyerActivity
  - commerceCompetingOrders
  - commerceLineItems
  - commerceMyOrders
  - commerceOrder
  - commerceOrderResult
  - commerceOrders
  - commerceAddInitialOfferToOrder
  - commerceApproveOrder
  - commerceBuyerAcceptOffer
  - commerceBuyerCounterOffer
  - commerceBuyerRejectOffer
  - commerceConfirmFulfillment
  - commerceConfirmPickup
  - commerceCreateBankDebitSetupForOrder
  - commerceCreateInquiryOfferOrderWithArtwork
  - commerceCreateInquiryOrderWithArtwork
  - commerceCreateOfferOrderWithArtwork
  reason: Artsy's entire buy/offer/checkout surface (Exchange) is GraphQL-only. The REST Public API exposes
    bids and bidder positions for auctions but no order, offer, payment or fulfilment operation at all.
- group: editorial
  fields:
  - article
  - articles
  - articlesConnection
  - author
  - authorsConnection
  - channel
  - page
  - pagesConnection
  - staticContent
  - video
  - videosConnection
  reason: Artsy Editorial (articles, authors, channels, videos) has no REST representation.
- group: viewing rooms
  fields:
  - privateViewingRoom
  - viewingRoom
  - viewingRooms
  - viewingRoomsConnection
  reason: Viewing Rooms are a first-class product on artsy.net and in llms.txt, and are absent from the
    REST contract entirely.
- group: price & market insights
  fields:
  - analyticsArtistSparklines
  - analyticsArtworkRecommendations
  - analyticsCalendarYearMarketPriceInsights
  - analyticsCalendarYearPriceInsights
  - analyticsLastUpdatedAt
  - analyticsPartnerStats
  - analyticsUserStats
  - auctionResult
  - auctionResultsByArtistsConnection
  - marketPriceInsights
  - priceInsights
  - recentlySoldArtworks
  reason: The Price Database / auction-results surface — arguably Artsy's most commercially valuable data
    — is GraphQL-only and not in the Public API.
- group: consignments & submissions
  fields:
  - consignments
  - submission
  - submissions
  - addAssetToConsignmentSubmission
  - addAssetsToConsignmentSubmission
  - convectionCreateConsignmentSubmission
  - createConsignmentInquiry
  - createConsignmentOffer
  - createConsignmentOfferResponse
  - createConsignmentSubmission
  - removeAssetFromConsignmentSubmission
  - updateConsignmentSubmission
  reason: Sell-side consignment submission flows exist only in Metaphysics.
- group: conversations & notifications
  fields:
  - conversation
  - conversationsConnection
  - notificationPreferences
  - notificationsConnection
  reason: Collector-gallery inquiry messaging is GraphQL-only.
- group: discovery & personalization
  fields:
  - artworksForUser
  - curatedMarketingCollections
  - curatedTrendingArtists
  - discoverArtworks
  - discoveryCategoriesConnection
  - discoveryCategoryArtworksConnection
  - discoveryCategoryConnection
  - discoveryMarketingCollections
  - homePage
  - homeView
  - marketingCollection
  - marketingCollections
  - trendingSearches
  reason: The recommendation/home-feed layer that powers artsy.net and the mobile apps has no REST analogue.
- group: artwork import / partner CMS
  fields:
  - artnetImport
  - artworkImport
  - batchArtworkImportImages
  - createArtworkImport
  - createArtworkImportArtistAssignment
  - createArtworkImportArtistMatch
  - createArtworkImportArtworks
  - createArtworkImportCellFlag
  - deleteArtworkImport
  - removeArtworkImportImage
  - updateArtworkImport
  - updateArtworkImportRow
  reason: Bulk partner ingestion tooling — the Partner API surface referenced in the retirement notice
    — surfaces through GraphQL, not the public REST contract.
rest_only:
- capability: client application management
  operations:
  - getApiApplications
  - postApiApplications
  - getApiApplicationsId
  - putApiApplicationsId
  - deleteApiApplicationsId
  reason: Registering and managing an OAuth client application is a REST-only administrative surface;
    Metaphysics has no equivalent root field.
- capability: token minting and revocation
  operations:
  - getApiTokens
  - postApiTokensXappToken
  - deleteApiTokensAccessToken
  reason: Token lifecycle is REST-only — and it is the prerequisite for calling either surface.
- capability: push devices
  operations:
  - getApiDevices
  - getApiDevicesId
  - deleteApiDevicesId
  reason: Device registration for push notifications has no public GraphQL root field.
- capability: partner communications and contacts
  operations:
  - getApiPartnerCommunications
  - getApiPartnerCommunicationsId
  - getApiPartnerContacts
  - getApiPartnerContactsId
  reason: Exposed on the REST contract only.
- capability: user fair actions
  operations:
  - getApiUserFairActions
  - getApiUserFairActionsId
  reason: REST-only.
- capability: API status
  operations:
  - getApiStatus
  reason: A machine-readable health endpoint on the REST surface; no GraphQL analogue.
