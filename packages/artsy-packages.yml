note: >-
  Artsy publishes a large npm surface under the @artsy scope, but almost all of it is front-end and
  internal engineering tooling (design system, icons, analytics schema, lint helpers) rather than an
  API client. Exactly ONE published package is a first-party client library for the Artsy API:
  @artsy/xapp. Everything else is recorded honestly for what it is, and third-party lookalikes are
  called out so they are not mistaken for official SDKs.
