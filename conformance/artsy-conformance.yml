standards:
  - id: swagger-2.0
    conforms: true
    evidence: >-
      The provider serves a Swagger 2.0 document at https://api.artsy.net/api/docs/ — "swagger": "2.0",
      49 paths, 53 operations, all with unique operationIds.
  - id: openapi-3
    conforms: false
    evidence: The published contract is Swagger 2.0; no OpenAPI 3.x document is served.
  - id: json-hal
    conforms: true
    evidence: >-
      "produces": ["application/hal+json", "application/json"] in the contract, and every response body
      carries _links / _embedded. The provider documents JSON+HAL as the response format on
      https://developers.artsy.net/v2/docs/http.
  - id: rfc6570-uri-templates
    conforms: true
    evidence: >-
      The API root returns 50 link relations, of which the collection and item relations carry
      "templated": true with RFC 6570 expressions, e.g.
      https://api.artsy.net/api/artworks{?artist_id,partner_id,show_id,...}
  - id: rfc8288-web-linking
    conforms: partial
    evidence: >-
      Link relations are carried in the HAL _links body object rather than in an HTTP Link header. The
      relation semantics are documented at https://developers.artsy.net/v2/docs/links.
  - id: oauth2
    conforms: true
    evidence: >-
      https://api.artsy.net/oauth2/authorize and https://api.artsy.net/oauth2/access_token, with
      authorization_code and a password-style "credentials" grant, documented at
      https://developers.artsy.net/v2/docs/authentication. NOTE the contract itself declares no
      securityDefinitions, so this is documented but not machine-readable.
  - id: oidc
    conforms: false
    evidence: >-
      No /.well-known/openid-configuration on any Artsy host (see well-known/artsy-well-known.yml);
      no id_token is issued.
  - id: rfc8414-oauth-metadata
    conforms: false
    evidence: /.well-known/oauth-authorization-server returned 404 on every probed host.
  - id: rfc9457-problem-details
    conforms: false
    evidence: >-
      Errors use a bespoke {type, message, detail} JSON envelope, not application/problem+json. See
      errors/artsy-problem-types.yml.
  - id: json-api
    conforms: false
    evidence: The response format is HAL, not JSON:API.
  - id: cursor-pagination
    conforms: true
    evidence: >-
      cursor/size/offset parameters with _links.next, documented at
      https://developers.artsy.net/v2/docs/pagination. Cursor is the provider's stated preference.
  - id: idempotency
    conforms: false
    evidence: >-
      No idempotency key or replay-safety mechanism anywhere in the documentation or contract. See
      conventions/artsy-conventions.yml idempotency.coverage = none.
  - id: graphql
    conforms: true
    evidence: >-
      Metaphysics, Artsy's GraphQL gateway, at https://metaphysics-production.artsy.net/v2. SDL of
      1,478 object types and 352 input types published by Artsy at
      https://github.com/artsy/metaphysics/blob/main/_schemaV2.graphql and saved to
      graphql/artsy-metaphysics.graphql.
  - id: graphql-introspection
    conforms: false
    evidence: >-
      A live POST of {__schema{queryType{name}}} to https://metaphysics-production.artsy.net/v2 returns
      "GraphQL introspection has been disabled". The schema is published out of band in the repo instead.
  - id: relay-global-object-identification
    conforms: true
    evidence: >-
      The Metaphysics SDL uses Relay connection types and Relay global "id" fields, with database
      identifiers exposed separately as internalID. Stated by Artsy in metaphysics AGENTS.md.
  - id: rfc9116-security-txt
    conforms: false
    evidence: /.well-known/security.txt returned 404/530 on all six probed Artsy hosts.
  - id: rfc8594-sunset-header
    conforms: false
    evidence: >-
      The Public API retirement is announced in prose on developers.artsy.net only; no Sunset or
