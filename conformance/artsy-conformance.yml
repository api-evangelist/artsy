  - id: rfc9116-a2a-agent-card
    conforms: false
    evidence: No agent card at /.well-known/agent-card.json or /.well-known/agent.json on any host.
  - id: llms-txt
    conforms: true
    evidence: >-
      https://www.artsy.net/llms.txt — HTTP 200, text/plain, 4,452 bytes, well-formed llms.txt with an
      H1, a blockquote summary and ten sectioned link lists. Saved verbatim to llms/artsy-llms.txt.
domain_standards:
  probed: true
  found: []
  note: >-
    REWARD-ONLY and genuinely empty here. The art-market sector has no adopted machine-readable
    interchange standard of the kind this check looks for (no SCIM/OData/OpenRTB/FHIR/LTI/OAI-PMH/
    ISO-20022 analogue). The nearest domain vocabulary in play is Artsy's own proprietary Art Genome
    Project gene taxonomy, exposed at /api/genes — a first-party vocabulary, not an industry standard,
    so it is recorded as a vocabulary rather than claimed as domain-standard conformance.
    CIDOC-CRM, LIDO and IIIF are the museum-sector standards that would qualify; the Artsy contract
    declares none of them.
