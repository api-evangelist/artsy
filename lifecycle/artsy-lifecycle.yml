  policy_url: https://developers.artsy.net/
  announcement: >-
    "Please note, we are in the process of retiring the public api. The public api, as well as its
    documentation and playground, may be taken down at any time without additional notice. This change
    will not affect integration partners using our partner api. If you're an Artsy partner gallery,
    reach out to your Artsy Liaison or contact our Support team for assistance."
  sunset_date: null
  notice_period: none — the provider explicitly reserves the right to take it down without further notice
  sunset_header: false
