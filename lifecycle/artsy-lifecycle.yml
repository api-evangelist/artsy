  migration_path: >-
    The Partner API, which is not publicly documented and is obtained through an Artsy Liaison or
    Support. Galleries and auction houses are directed there; there is no announced public successor
    for non-partner consumers.
  implication_for_agents: >-
    Any agent building against api.artsy.net should treat every endpoint as end-of-life. The
    replacement surface is sales-gated, so this is not a migration an agent can perform unattended.
