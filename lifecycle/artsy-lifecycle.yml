note: >-
  Artsy has publicly announced that the Public API is being retired. The banner below appears at the
  top of EVERY page of developers.artsy.net, including the API reference and every convention page, and
  is quoted verbatim. This is a live deprecation notice with no dated sunset — the strongest signal
  this record carries and the reason the lifecycle grade is honest rather than generous.
