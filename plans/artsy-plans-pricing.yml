description: >-
  Artsy publishes NO priced plans for its APIs. This file replaces a 2026-05-04 bulk-sweep scaffold that
  invented a "Free" tier with a 1,000-requests/month quota and a paid tier — neither of which Artsy has
  ever published. The real commercial shape is recorded below.
tags:
  - Art
  - Marketplace
  - Pricing
plan_count: 0
plans: []
commercial_model:
  public_api:
    price: free
    metered: false
    quota_published: false
    gate: >-
      Self-service. Register a client application at https://developers.artsy.net/client_applications
      to obtain a client_id and client_secret. No payment step exists.
    restriction: >-
      Not a free tier of a paid product — a restricted-purpose API. The provider limits it to images of
      historic artwork and related information for educational and other non-commercial purposes, and
      states that only public-domain works are currently accessible.
    terms: https://developers.artsy.net/v2/terms
    status: >-
      Announced for retirement. See lifecycle/artsy-lifecycle.yml — the provider reserves the right to
      take the Public API down at any time without additional notice.
  partner_api:
    price: not-published
    gate: sales / partnership
    detail: >-
      The Partner API enables select partners to upload artworks and manage partner artists. Access is
      granted through an Artsy Liaison or Artsy Support; neither documentation nor pricing is public.
    contact: https://partners.artsy.net/
note: >-
  A plan_count of 0 here is a measurement, not a gap in this pass: the pricing surface was read and
  Artsy genuinely publishes no API plans or prices.
