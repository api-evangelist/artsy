apis:
- aid: artsy:metaphysics
  name: Artsy Metaphysics GraphQL API
  description: >-
    Metaphysics is Artsy's public GraphQL gateway — the contract that actually powers artsy.net and the
    Artsy iOS and Android apps. It wraps Artsy's internal services (Gravity, Exchange, Convection) behind
    a single Relay-compatible schema of 1,478 object types, 165 Query root fields and 306 mutations, covering
    commerce and offers, editorial, viewing rooms, price and auction insights, consignment submissions,
    conversations and personalized discovery — none of which the retiring REST Public API exposes. Runtime
    introspection is disabled; Artsy publishes the schema instead as _schemaV2.graphql in the open-source
    metaphysics repository. Most fields require a user access token obtained through the same OAuth 2
    endpoints as the REST API.
  humanURL: https://github.com/artsy/metaphysics
  baseURL: https://metaphysics-production.artsy.net/v2
  tags:
  - GraphQL
  - Art
  - Commerce
  - Auctions
  - Editorial
  properties:
  - type: GraphQL
    url: graphql/artsy-metaphysics.graphql
  - type: GraphQLSchema
    url: graphql/artsy-metaphysics.graphql
  - type: SourceCode
    url: https://github.com/artsy/metaphysics
  - type: Documentation
    url: https://github.com/artsy/metaphysics/blob/main/README.md
  - type: ToolCrosswalk
    url: mcp/artsy-tool-crosswalk.yml
